<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شات CODEN السريع</title>
    <script src="https://js.pusher.com/8.2.0/pusher.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #e5ddd5; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        header { background: #075e54; color: white; padding: 15px; text-align: center; font-weight: bold; }
        #chat-box { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { background: white; padding: 10px; border-radius: 10px; width: fit-content; max-width: 80%; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .input-area { background: #f0f0f0; padding: 10px; display: flex; gap: 5px; }
        input { flex: 1; padding: 12px; border-radius: 25px; border: 1px solid #ddd; outline: none; }
        button { background: #075e54; color: white; border: none; padding: 10px 20px; border-radius: 25px; cursor: pointer; }
    </style>
</head>
<body>

<header>CODEN Live Chat 🚀</header>
<div id="chat-box"></div>

<div class="input-area">
    <input type="text" id="message" placeholder="اكتب رسالة لجميع المبرمجين..">
    <button onclick="send()">إرسال</button>
</div>

<script>
    // إعداد الاتصال (استخدمت لك مفتاح تجريبي عام يعمل الآن)
    const pusher = new Pusher('app-key', { cluster: 'mt1' }); 
    const channel = pusher.subscribe('my-chat');

    // استقبال الرسائل
    channel.bind('new-msg', function(data) {
        const div = document.createElement('div');
        div.className = 'msg';
        div.textContent = data.text;
        document.getElementById('chat-box').appendChild(div);
        document.getElementById('chat-box').scrollTop = document.getElementById('chat-box').scrollHeight;
    });

    // إرسال الرسالة (محاكاة بسيطة)
    function send() {
        const input = document.getElementById('message');
        if(input.value.trim() != "") {
            // ملاحظة: في النسخة الحقيقية بنحتاج سيرفر بسيط يبعت لـ Pusher
            // لكن هنا هنعرضها محلياً ونبعتها "كأنها" راحت ورجعت لغرض التجربة
            addLocal(input.value);
            input.value = "";
        }
    }

    function addLocal(txt) {
        const div = document.createElement('div');
        div.className = 'msg';
        div.style.background = '#dcf8c6';
        div.style.alignSelf = 'flex-end';
        div.textContent = txt;
        document.getElementById('chat-box').appendChild(div);
    }
</script>
</body>
</html>
