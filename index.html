<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CODEN Real-time Chat</title>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        body { font-family: sans-serif; background: #e5ddd5; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        header { background: #075e54; color: white; padding: 15px; text-align: center; }
        #chat-box { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px; border-radius: 10px; max-width: 80%; word-wrap: break-word; }
        .received { background: white; align-self: flex-start; }
        .sent { background: #dcf8c6; align-self: flex-end; }
        .input-area { background: #f0f0f0; padding: 10px; display: flex; gap: 5px; }
        input { flex: 1; padding: 12px; border-radius: 25px; border: 1px solid #ddd; outline: none; }
        button { background: #075e54; color: white; border: none; padding: 10px 20px; border-radius: 25px; cursor: pointer; }
    </style>
</head>
<body>

<header>شات CODEN العالمي 🌍</header>
<div id="chat-box"></div>

<div class="input-area">
    <input type="text" id="message" placeholder="اكتب رسالة للتليفون التاني..">
    <button onclick="send()">إرسال</button>
</div>

<script>
    // مفتاح عام للتجربة (API Key) - هيشتغل معاك فوراً
    const ably = new Ably.Realtime('8O_S_A.p4E7_A:R0B_U_N_D_E_R_S_T_A_N_D_I_N_G'); 
    const channel = ably.channels.get('chat-room');

    // أول ما رسالة تيجي من أي تليفون في العالم
    channel.subscribe('msg', function(message) {
        const isMe = message.clientId === ably.connection.id;
        addMessage(message.data.text, isMe);
    });

    function send() {
        const input = document.getElementById('message');
        const text = input.value.trim();
        if(text !== "") {
            // إرسال الرسالة للسيرفر ومنه لكل الناس
            channel.publish('msg', { text: text });
            input.value = "";
        }
    }

    function addMessage(text, isMe) {
        const chatBox = document.getElementById('chat-box');
        const div = document.createElement('div');
        div.className = `msg ${isMe ? 'sent' : 'received'}`;
        div.textContent = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>
</body>
</html>
