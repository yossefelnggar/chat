<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CODEN Chat - واتساب مبسط</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #e5ddd5; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        header { background: #075e54; color: white; padding: 15px; text-align: center; font-size: 1.2rem; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        
        #chat-box { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        
        .message { max-width: 75%; padding: 8px 12px; border-radius: 15px; font-size: 0.95rem; line-height: 1.4; position: relative; }
        .sent { background: #dcf8c6; align-self: flex-end; border-bottom-right-radius: 2px; }
        .received { background: white; align-self: flex-start; border-bottom-left-radius: 2px; }
        .user-name { font-weight: bold; font-size: 0.75rem; display: block; margin-bottom: 2px; color: #2b7d74; }

        .input-area { background: #f0f0f0; padding: 10px; display: flex; gap: 10px; align-items: center; }
        input { flex: 1; padding: 12px; border-radius: 25px; border: none; outline: none; }
        button { background: #075e54; color: white; border: none; padding: 10px 20px; border-radius: 25px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<header>منصة CODEN - مراسلة فورية</header>

<div id="chat-box">
    </div>

<div class="input-area">
    <input type="text" id="username" placeholder="اسمك.." style="width: 20%; flex: none;">
    <input type="text" id="msgInput" placeholder="اكتب رسالتك هنا..">
    <button onclick="sendMessage()">إرسال</button>
</div>

<script>
    // --- إعدادات Firebase (قاعدة بيانات مجانية تجريبية) ---
    // ملحوظة: هذه الإعدادات تعمل كمثال، لجعله خاصاً بك تماماً يجب إنشاء مشروع في Firebase Console
    const firebaseConfig = {
        databaseURL: "https://testing-project-default-rtdb.firebaseio.com/" 
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const chatBox = document.getElementById('chat-box');
    const msgInput = document.getElementById('msgInput');
    const nameInput = document.getElementById('username');

    // دالة إرسال الرسالة
    function sendMessage() {
        const name = nameInput.value || "مجهول";
        const text = msgInput.value;

        if (text.trim() !== "") {
            db.ref("messages").push().set({
                "sender": name,
                "message": text,
                "time": Date.now()
            });
            msgInput.value = "";
        }
    }

    // الاستماع للرسائل الجديدة في قاعدة البيانات
    db.ref("messages").limitToLast(20).on("child_added", (snapshot) => {
        const data = snapshot.val();
        displayMessage(data.sender, data.message);
    });

    function displayMessage(sender, message) {
        const msgDiv = document.createElement('div');
        // تمييز رسالتك عن رسائل الآخرين (بناءً على الاسم المسجل)
        const isMyMsg = sender === nameInput.value;
        
        msgDiv.className = `message ${isMyMsg ? 'sent' : 'received'}`;
        msgDiv.innerHTML = `<span class="user-name">${sender}</span>${message}`;
        
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight; // النزول لآخر رسالة
    }

    // الإرسال عند الضغط على Enter
    msgInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter") sendMessage();
    });
</script>

</body>
</html>
